[package]
name = "noisette"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Game save backup tool for wine prefixes (ludusavi manifest)"

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
etcetera = "0.11"
glob = "0.3"
indicatif = "0.18"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
terminal_size = "0.4"
thiserror = "2"
toml = "1"
ureq = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
absolute_paths = "warn"
